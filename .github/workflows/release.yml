name: Release

# Chỉ chạy khi có tag dạng v3.16. Đẩy code lên main thì chỉ chạy test —
# phát hành phải là một hành động cố ý, vì nó gửi bản mới tới mọi máy đang cài.
on:
  push:
    tags: ["v*"]
  # Chạy tay từ tab Actions: build y như bản phát hành nhưng KHÔNG phát hành,
  # chỉ để lại file build làm artifact — để đưa lên VirusTotal kiểm tra trước
  # khi đánh tag.
  workflow_dispatch:

# Workflow này tạo release, nên cần quyền ghi. GITHUB_TOKEN do GitHub tự cấp
# cho từng lần chạy và hết hạn ngay sau đó — không cần PAT cá nhân nào.
permissions:
  contents: write
  # Ba quyền dưới chỉ để ký attestation (xem bước cuối): id-token để xin chứng
  # chỉ ngắn hạn từ Sigstore, hai quyền còn lại để lưu attestation vào repo.
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      # Hai repo nằm cạnh nhau, đúng cách checkout trên máy mình: `paths.py`
      # tìm dữ liệu wiki ở `<gốc>/../onmyoji_wiki`, và bản đóng gói nhúng nó vào.
      - uses: actions/checkout@v7
        with:
          path: onmyoji-auto

      - uses: actions/checkout@v7
        with:
          repository: Long173/onmyoji_wiki
          path: onmyoji_wiki
          sparse-checkout: assets

      - uses: actions/setup-python@v7
        with:
          # Cùng phiên bản mà máy build vẫn dùng.
          python-version: '3.12'
          cache: pip
          cache-dependency-path: onmyoji-auto/requirements.txt

      - name: Cài dependencies
        working-directory: onmyoji-auto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      # PyInstaller cài từ mã nguồn, tự biên dịch bootloader — phần .exe khởi
      # động — thay cho bản dựng sẵn trong wheel. Bản dựng sẵn giống hệt từng
      # byte ở mọi chương trình đóng gói bằng PyInstaller, kể cả mã độc (như
      # "Blank Grabber"), nên vài phần mềm diệt virus nhận nhầm theo nó: bản
      # 3.21 bị 3/71 gắn "trojan.blank". Bootloader tự build là file của riêng
      # mình. Máy Windows của GitHub có sẵn MSVC để biên dịch.
      # Ghim phiên bản: bản build phải lặp lại được, và test.yml chạy cùng bản.
      - name: Cài PyInstaller, tự build bootloader
        working-directory: onmyoji-auto
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install --verbose --no-binary=pyinstaller pyinstaller==6.20.0

      # Chặn nếu bước trên lặng lẽ dùng lại bootloader dựng sẵn (ví dụ pip lấy
      # wheel từ cache): so với file trong wheel chính thức, phải khác.
      - name: Kiểm tra bootloader đã được build lại
        shell: bash
        run: |
          set -euo pipefail
          pip download pyinstaller==6.20.0 --only-binary=:all: --no-deps -d "$RUNNER_TEMP/wheel"
          python - "$RUNNER_TEMP/wheel" <<'PY'
          import glob, hashlib, pathlib, sys, zipfile
          import PyInstaller
          name = "PyInstaller/bootloader/Windows-64bit-intel/runw.exe"
          wheel = glob.glob(sys.argv[1] + "/*.whl")[0]
          stock = hashlib.sha256(zipfile.ZipFile(wheel).read(name)).hexdigest()
          ours = hashlib.sha256((pathlib.Path(PyInstaller.__file__).parent
                                 / "bootloader/Windows-64bit-intel/runw.exe")
                                .read_bytes()).hexdigest()
          print("stock runw.exe", stock)
          print("built runw.exe", ours)
          if ours == stock:
              sys.exit("Bootloader is still the stock one - not rebuilt")
          PY

      # Chặn cuối. Không phát hành bản có test đỏ — mỗi bản phát hành đều được
      # hàng trăm máy tự tải về, và rút lại thì đã muộn.
      - name: Chạy test
        working-directory: onmyoji-auto
        run: >
          python -m pytest tests -q --tb=short -rf
          --ignore=tests/test_single_instance.py

      - name: Chạy test single-instance
        working-directory: onmyoji-auto
        run: python -m pytest tests/test_single_instance.py -q --tb=short -rf

      # Tag v3.16 -> 3.16. publish_release.py tự dừng nếu số này khác
      # theme.APP_VERSION, nên một tag đánh nhầm không ship được gì.
      - name: Đọc phiên bản từ tag
        if: startsWith(github.ref, 'refs/tags/')
        id: version
        shell: bash
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Đóng gói
        working-directory: onmyoji-auto
        run: python -m PyInstaller onmyoji_auto.spec --noconfirm

      # Ghi chú lấy từ mục tương ứng trong CHANGELOG.md, không truyền qua dòng
      # lệnh: tiếng Việt đi qua argv trên Windows từng bị đổi sang codepage ANSI
      # và ra "Cá»­a sá»•". Không có mục cho phiên bản này thì script dừng.
      # Chạy tay (không có tag): dừng ở đây, chỉ giữ lại bản build để kiểm tra.
      - name: Lưu bản build (chạy thử)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: onmyoji-tool-dry-run
          path: onmyoji-auto/dist/Onmyoji Tool/Onmyoji Tool.exe
          retention-days: 7

      - name: Phát hành
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: onmyoji-auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: >
          python tools/publish_release.py ${{ steps.version.outputs.number }}
          --from-changelog --upload

      # Chứng nhận file .zip được build bởi chính workflow này, từ đúng commit
      # của tag. SHA-256 trong manifest chỉ chứng minh file không bị sửa trên
      # đường tải; attestation chứng minh nó đến từ mã nguồn công khai trong
      # repo. Ai cũng tự kiểm tra được:
      #   gh attestation verify OnmyojiTool-3.22.zip -R Long173/onmyoji-auto-releases
      # Đặt sau bước phát hành: attestation gắn với nội dung file (digest),
      # không phụ thuộc file đã được tải lên hay chưa.
      - name: Ký attestation cho bản build
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/attest@v4
        with:
          subject-path: onmyoji-auto/dist/release/*.zip
